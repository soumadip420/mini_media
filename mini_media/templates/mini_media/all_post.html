{% extends 'mini_media/main.html'%}
{% load static%}
{% block content%}
<link rel="stylesheet" href="{% static 'css/all_post.css' %}">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

<main class="page-wrap">
  <div class="posts-grid">
    {% for p in posts%}
    <div class="post-card">
        {% if p.image%}
        <div class="post-thumb-box">
            <img src="{{p.image.url}}" alt="Post image">
        </div>
      {% endif%}
      <div class="post-body">
        <p class="post-title">{{p.description}}</p>
        <p class="post-meta">posted {{p.created_at}}</p>
        <div class="post-actions">
          <button type="button" class="action-btn view" onclick="openImage('{{p.image.url}}')">
          <svg viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>View
        </button>
          <a href="{% url 'update_post' p.id %}" class="action-btn update">
            <svg viewBox="0 0 24 24">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>Update
          </a>
          <form method="POST" action="{%url 'delete_post' p.id%}">
                {% csrf_token%}
                <input type="hidden" name="next" value="all_post">
                <button class="action-btn delete">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 6h18"/>
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                        </svg>Delete
                </button>
           </form>
        </div>
      </div>
    </div>
    {%empty%}
        <p>No posts yet</p>
    {% endfor %}
  </div>
</main>
<div class="image-modal" id="imageModal">
    <button type="button" class="close-modal" onclick="closeImage()">
        &times;
    </button>

    <img id="fullImage" src="" alt="Full size image">
</div>
<script src="{% static 'js/modal.js' %}"></script>
{% endblock%}
